<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WiFi Sense · Radar</title>
<style>
:root {
  --bg:      #05080e;
  --surf:    #0d1117;
  --surf2:   #161b22;
  --border:  #21262d;
  --accent:  #00d4ff;
  --adim:    rgba(0,212,255,.12);
  --green:   #22c55e;
  --violet:  #a855f7;
  --orange:  #f97316;
  --red:     #ef4444;
  --text:    #e6edf3;
  --muted:   #7d8590;
  --dim:     #3d444d;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-tap-highlight-color: transparent; }
body {
  background: radial-gradient(120% 80% at 50% -10%, #0a1322 0%, var(--bg) 60%);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  min-height: 100dvh;
  overscroll-behavior: none;
}

/* ── HEADER ─────────────────────────────────────────── */
.header {
  position: sticky; top: 0; z-index: 9;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px;
  background: rgba(13,17,23,.82);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: .95rem; letter-spacing: 1.5px; color: var(--accent);
}
.rings { width: 26px; height: 26px; position: relative; display: flex; align-items: center; justify-content: center; }
.ring { position: absolute; border: 1.5px solid var(--accent); border-radius: 50%; animation: ripple 2.4s ease-out infinite; }
.ring:nth-child(1) { width:8px;  height:8px;  animation-delay:0s;   opacity:.9; }
.ring:nth-child(2) { width:16px; height:16px; animation-delay:.55s; opacity:.6; }
.ring:nth-child(3) { width:24px; height:24px; animation-delay:1.1s; opacity:.3; }
@keyframes ripple { 0%{transform:scale(.4);opacity:1} 100%{transform:scale(1);opacity:0} }
.badge {
  display: flex; align-items: center; gap: 7px; font-size: .72rem; color: var(--muted);
  background: var(--surf2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex-shrink: 0; transition: background .4s; }
.dot.live { background: var(--green); box-shadow: 0 0 7px var(--green); animation: blink 2s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

/* ── LAYOUT ──────────────────────────────────────────── */
.main {
  padding: 14px;
  display: grid; gap: 14px;
  grid-template-columns: minmax(0,1.55fr) minmax(260px,1fr);
  max-width: 1180px; margin: 0 auto;
}
@media(max-width:860px) { .main { grid-template-columns: 1fr; } }

/* ── RADAR ───────────────────────────────────────────── */
.radar-card {
  position: relative;
  background: var(--surf); border: 1px solid var(--border); border-radius: 16px;
  padding: 14px; overflow: hidden;
}
.radar-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; }
#radar { display: block; width: 100%; height: 100%; border-radius: 12px; background: #070b12; }
.radar-tag {
  position: absolute; top: 22px; left: 24px; z-index: 2;
  font-size: .58rem; letter-spacing: 3px; text-transform: uppercase; color: var(--muted);
  pointer-events: none;
}
.radar-count {
  position: absolute; top: 18px; right: 24px; z-index: 2; text-align: right; pointer-events: none;
}
.radar-count b { font-size: 2.6rem; font-weight: 900; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.radar-count span { display: block; font-size: .54rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 2px; }

/* ── SIDE PANEL ──────────────────────────────────────── */
.side { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surf); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
.clabel { font-size: .58rem; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }

.status-row { display: flex; align-items: center; justify-content: space-between; }
.status-big { font-size: 1.6rem; font-weight: 800; letter-spacing: -.5px; color: var(--dim); transition: color .4s; }
.status-big.occupied { color: var(--green); }
.pill { font-size: .62rem; letter-spacing: 1px; text-transform: uppercase; padding: 4px 10px; border-radius: 20px;
        border: 1px solid var(--border); color: var(--muted); }
.pill.live { border-color: var(--green); color: var(--green); }

.act-line { display: flex; align-items: center; gap: 12px; }
.act-icon { font-size: 2rem; }
.act-text { font-size: 1.25rem; font-weight: 700; }

.gauge-meta { display: flex; justify-content: space-between; font-size: .68rem; color: var(--muted); margin-bottom: 6px; }
.track { height: 6px; background: var(--surf2); border-radius: 3px; overflow: hidden; }
.fill { height: 100%; border-radius: 3px; width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--orange), var(--red));
        transition: width .4s cubic-bezier(.4,0,.2,1); }

#targets { display: flex; flex-direction: column; gap: 8px; min-height: 24px; }
.tgt { display: flex; align-items: center; gap: 10px; font-size: .82rem; }
.tgt .swatch { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 8px currentColor; }
.tgt .who { font-weight: 600; }
.tgt .where { color: var(--muted); margin-left: auto; font-size: .72rem; letter-spacing: .5px; }
.tgt.empty { color: var(--dim); font-size: .8rem; }

#spark { display: block; width: 100%; height: 42px; border-radius: 8px; background: var(--surf2); }

/* ── SCENARIOS ───────────────────────────────────────── */
.scenarios { grid-column: 1 / -1; }
.scen-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.scen-btn { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); font-size: .76rem; font-family: inherit;
  cursor: pointer; transition: all .2s; user-select: none; }
.scen-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--adim); }
.scen-btn.on { border-color: var(--accent); color: var(--accent); background: var(--adim); }

footer { text-align: center; padding: 18px; font-size: .66rem; color: var(--dim); }
.est-note { color: var(--orange); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="rings"><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>
    WIFI SENSE
  </div>
  <div class="badge"><div class="dot" id="dot"></div><span id="conn">Connecting…</span></div>
</div>

<div class="main">

  <!-- RADAR -->
  <div class="radar-card">
    <div class="radar-tag" id="radar-tag">Live Floor Radar</div>
    <div class="radar-count"><b id="count">0</b><span>tracked</span></div>
    <div class="radar-wrap"><canvas id="radar"></canvas></div>
  </div>

  <!-- SIDE -->
  <div class="side">
    <div class="card">
      <div class="clabel">Room Status</div>
      <div class="status-row">
        <div class="status-big" id="status">EMPTY</div>
        <div class="pill" id="detpill">0 detected</div>
      </div>
    </div>

    <div class="card">
      <div class="clabel">Activity</div>
      <div class="act-line">
        <div class="act-icon" id="act-icon">—</div>
        <div class="act-text" id="act-text">Empty</div>
      </div>
    </div>

    <div class="card">
      <div class="clabel">Motion Level</div>
      <div class="gauge-meta"><span>Low</span><span id="mpct">0 %</span><span>High</span></div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>

    <div class="card">
      <div class="clabel">Tracked Targets</div>
      <div id="targets"><div class="tgt empty">No targets in range</div></div>
    </div>

    <div class="card">
      <div class="clabel">Live CSI</div>
      <canvas id="spark"></canvas>
    </div>
  </div>

  <!-- SCENARIOS -->
  <div class="card scenarios" id="sim-panel">
    <div class="clabel">Simulation Scenarios</div>
    <div class="scen-btns">
      <button class="scen-btn"    data-s="empty"              onclick="setScen(this)">Empty Room</button>
      <button class="scen-btn on" data-s="one_person_sitting" onclick="setScen(this)">1 Person Sitting</button>
      <button class="scen-btn"    data-s="one_person_walking" onclick="setScen(this)">1 Person Walking</button>
      <button class="scen-btn"    data-s="two_people"         onclick="setScen(this)">2 People</button>
      <button class="scen-btn"    data-s="sleeping"           onclick="setScen(this)">Person Sleeping</button>
    </div>
  </div>

</div>
<footer id="foot">WiFi Sense · through-wall presence radar</footer>

<script>
(() => {
  /* ── WebSocket ──────────────────────────── */
  let ws;
  const dot  = document.getElementById('dot');
  const conn = document.getElementById('conn');

  let state = { presence:false, count:0, detected:0, activity:'empty',
                motion:0, targets:[], mode:'simulate', estimated:false };

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen  = () => { dot.classList.add('live');  conn.textContent = 'Live'; };
    ws.onclose = () => { dot.classList.remove('live'); conn.textContent = 'Reconnecting…'; setTimeout(connect, 2000); };
    ws.onerror = () => ws.close();
    ws.onmessage = e => ingest(JSON.parse(e.data));
  }
  connect();

  /* ── activity maps ──────────────────────── */
  const ICONS = { empty:'—', stationary:'🧍', 'present/breathing':'🫁', breathing:'🫁',
                  walking:'🚶', moving:'🏃', sleeping:'😴' };
  const LABELS = { empty:'Empty', stationary:'Stationary', 'present/breathing':'Breathing',
                   breathing:'Breathing', walking:'Walking', moving:'Moving', sleeping:'Sleeping' };

  /* colour per activity → used for blips + legend swatches */
  function actColor(a) {
    if (a === 'walking' || a === 'moving') return '#00d4ff';
    if (a === 'sleeping')                  return '#a855f7';
    return '#22c55e';                       // breathing / stationary / present
  }

  /* ── house floorplan: quadrant room names ─ */
  function roomName(x, y) {
    if (x < 0.5 && y < 0.5) return 'BEDROOM';
    if (x >= 0.5 && y < 0.5) return 'BATH';
    if (x < 0.5 && y >= 0.5) return 'LIVING';
    return 'KITCHEN';
  }

  /* ── ingest WS frame → update DOM + state ─ */
  function ingest(d) {
    if (d.mode === 'esp32') document.getElementById('sim-panel').style.display = 'none';

    state.presence  = !!d.presence;
    state.detected  = d.person_count || 0;
    state.activity  = d.activity || 'empty';
    state.motion    = d.motion_score || 0;
    state.mode      = d.mode || 'simulate';
    state.targets   = Array.isArray(d.targets) ? d.targets : [];
    state.count     = state.targets.length;
    state.estimated = state.targets.some(t => t.estimated);

    // status
    const status = document.getElementById('status');
    status.textContent = state.presence ? 'OCCUPIED' : 'EMPTY';
    status.classList.toggle('occupied', state.presence);

    const pill = document.getElementById('detpill');
    pill.textContent = state.detected + ' detected';
    pill.classList.toggle('live', state.detected > 0);

    document.getElementById('count').textContent = state.count;
    document.getElementById('act-icon').textContent = ICONS[state.activity] || '—';
    document.getElementById('act-text').textContent = LABELS[state.activity] || state.activity;

    const pct = Math.min(100, state.motion * 3000);
    document.getElementById('fill').style.width = pct.toFixed(1) + '%';
    document.getElementById('mpct').textContent  = pct.toFixed(0) + ' %';

    // radar mode tag + estimate note
    document.getElementById('radar-tag').textContent =
      state.mode === 'esp32' ? 'Estimated Radar (zone)' : 'Live Floor Radar';
    document.getElementById('foot').innerHTML = state.estimated
      ? 'WiFi Sense · <span class="est-note">positions estimated from zone energy — single link can\'t triangulate</span>'
      : 'WiFi Sense · through-wall presence radar';

    // target legend list
    const tl = document.getElementById('targets');
    if (!state.targets.length) {
      tl.innerHTML = '<div class="tgt empty">No targets in range</div>';
    } else {
      tl.innerHTML = state.targets.map((t, i) => {
        const c = actColor(t.activity);
        const a = LABELS[t.activity] || t.activity;
        return `<div class="tgt"><span class="swatch" style="color:${c};background:${c}"></span>`
             + `<span class="who">Target ${i+1}</span> · ${a}`
             + `<span class="where">${roomName(t.x, t.y)}</span></div>`;
      }).join('');
    }

    pushSpark(d.amplitude);
    syncBlips();
  }

  /* ── blips: smooth-interpolated radar dots ─ */
  let blips = [];   // {x,y, tx,ty, activity, estimated}
  function syncBlips() {
    const tg = state.targets;
    // grow / shrink to match target count
    while (blips.length < tg.length) {
      const t = tg[blips.length];
      blips.push({ x:t.x, y:t.y, tx:t.x, ty:t.y, activity:t.activity, estimated:!!t.estimated });
    }
    if (blips.length > tg.length) blips.length = tg.length;
    tg.forEach((t, i) => { blips[i].tx = t.x; blips[i].ty = t.y;
                           blips[i].activity = t.activity; blips[i].estimated = !!t.estimated; });
  }

  /* ── CSI sparkline ──────────────────────── */
  const sCv = document.getElementById('spark');
  let sCtx, sW, sH;
  function sizeSpark() {
    const r = sCv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    sCv.width = r.width * dpr; sCv.height = r.height * dpr;
    sCtx = sCv.getContext('2d'); sCtx.setTransform(dpr,0,0,dpr,0,0);
    sW = r.width; sH = r.height;
  }
  function pushSpark(amp) {
    if (!sCtx || !amp) return;
    const n = amp.length;
    sCtx.clearRect(0,0,sW,sH);
    sCtx.strokeStyle = '#00d4ff'; sCtx.lineWidth = 1.4;
    sCtx.shadowColor = '#00d4ff'; sCtx.shadowBlur = 6;
    sCtx.beginPath();
    amp.forEach((v,i) => {
      const x = i/(n-1)*sW;
      const y = sH - Math.max(0,Math.min(1,v))*sH*.8 - sH*.1;
      i ? sCtx.lineTo(x,y) : sCtx.moveTo(x,y);
    });
    sCtx.stroke(); sCtx.shadowBlur = 0;
  }

  /* ── RADAR render loop ──────────────────── */
  const rCv = document.getElementById('radar');
  let rCtx, RW, RH, PAD, sweep = 0;
  function sizeRadar() {
    const r = rCv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    rCv.width = r.width * dpr; rCv.height = r.height * dpr;
    rCtx = rCv.getContext('2d'); rCtx.setTransform(dpr,0,0,dpr,0,0);
    RW = r.width; RH = r.height; PAD = Math.round(Math.min(RW,RH) * 0.07);
  }
  function resize() { sizeRadar(); sizeSpark(); }
  window.addEventListener('resize', resize);

  // map room-space [0..1] → canvas px (inside the house walls)
  const mapX = x => PAD + x * (RW - 2*PAD);
  const mapY = y => PAD + y * (RH - 2*PAD);

  function drawFloor() {
    const x0 = PAD, y0 = PAD, x1 = RW-PAD, y1 = RH-PAD;
    const midX = (x0+x1)/2, midY = (y0+y1)/2;
    const door = Math.min(RW,RH) * 0.10;   // doorway gap half-width

    // backdrop grid
    rCtx.strokeStyle = 'rgba(0,212,255,.05)'; rCtx.lineWidth = 1;
    for (let gx = x0; gx <= x1; gx += (x1-x0)/12) { rCtx.beginPath(); rCtx.moveTo(gx,y0); rCtx.lineTo(gx,y1); rCtx.stroke(); }
    for (let gy = y0; gy <= y1; gy += (y1-y0)/12) { rCtx.beginPath(); rCtx.moveTo(x0,gy); rCtx.lineTo(x1,gy); rCtx.stroke(); }

    // outer + inner walls (with doorway gaps)
    rCtx.strokeStyle = 'rgba(0,212,255,.45)'; rCtx.lineWidth = 2; rCtx.lineCap = 'round';
    rCtx.strokeRect(x0, y0, x1-x0, y1-y0);
    // vertical divider with door
    rCtx.beginPath();
    rCtx.moveTo(midX, y0);   rCtx.lineTo(midX, midY-door);
    rCtx.moveTo(midX, midY+door); rCtx.lineTo(midX, y1);
    // horizontal divider with door
    rCtx.moveTo(x0, midY);   rCtx.lineTo(midX-door, midY);
    rCtx.moveTo(midX+door, midY); rCtx.lineTo(x1, midY);
    rCtx.stroke();

    // room labels
    rCtx.fillStyle = 'rgba(125,133,144,.5)';
    rCtx.font = `${Math.round(Math.min(RW,RH)*0.028)}px system-ui`;
    rCtx.textAlign = 'center'; rCtx.textBaseline = 'middle';
    const qx = (x0+midX)/2, qx2 = (midX+x1)/2, qy = (y0+midY)/2, qy2 = (midY+y1)/2;
    rCtx.fillText('BEDROOM', qx, qy);  rCtx.fillText('BATH', qx2, qy);
    rCtx.fillText('LIVING', qx, qy2);  rCtx.fillText('KITCHEN', qx2, qy2);

    return { cx: midX, cy: midY };
  }

  function drawSweep(cx, cy) {
    const R = Math.hypot(RW, RH);
    // range rings
    rCtx.strokeStyle = 'rgba(0,212,255,.10)'; rCtx.lineWidth = 1;
    for (let k = 1; k <= 3; k++) { rCtx.beginPath(); rCtx.arc(cx, cy, (Math.min(RW,RH)/2)*k/3, 0, 7); rCtx.stroke(); }
    // rotating beam
    const g = rCtx.createConicGradient ? rCtx.createConicGradient(sweep, cx, cy) : null;
    if (g) {
      g.addColorStop(0,    'rgba(0,212,255,.22)');
      g.addColorStop(0.06, 'rgba(0,212,255,0)');
      g.addColorStop(1,    'rgba(0,212,255,0)');
      rCtx.fillStyle = g;
      rCtx.beginPath(); rCtx.moveTo(cx, cy); rCtx.arc(cx, cy, R, sweep, sweep+0.5); rCtx.closePath(); rCtx.fill();
    }
    // leading edge line
    rCtx.strokeStyle = 'rgba(0,212,255,.35)'; rCtx.lineWidth = 1.5;
    rCtx.beginPath(); rCtx.moveTo(cx, cy); rCtx.lineTo(cx + Math.cos(sweep)*R, cy + Math.sin(sweep)*R); rCtx.stroke();
  }

  function drawBlips(cx, cy, dt) {
    blips.forEach(b => {
      // smooth toward latest target position
      b.x += (b.tx - b.x) * Math.min(1, dt*6);
      b.y += (b.ty - b.y) * Math.min(1, dt*6);
      const px = mapX(b.x), py = mapY(b.y);
      const col = actColor(b.activity);

      // sweep "ping" glow — brighten when beam passes the blip
      const ang = Math.atan2(py - cy, px - cx);
      let diff = Math.abs(((ang - sweep) % (Math.PI*2) + Math.PI*3) % (Math.PI*2) - Math.PI);
      const ping = Math.max(0, 1 - diff / 0.9);

      // pulsing presence ring
      const t = performance.now()/1000;
      const pulse = 14 + Math.sin(t*3 + b.x*10)*3 + (b.activity==='walking'?6:0);
      rCtx.beginPath(); rCtx.arc(px, py, pulse + ping*16, 0, 7);
      rCtx.fillStyle = hexA(col, 0.08 + ping*0.20); rCtx.fill();

      // core dot
      rCtx.beginPath(); rCtx.arc(px, py, b.estimated ? 4 : 6, 0, 7);
      rCtx.fillStyle = col; rCtx.shadowColor = col; rCtx.shadowBlur = 12 + ping*14;
      rCtx.fill(); rCtx.shadowBlur = 0;

      // estimated blips get a dashed uncertainty ring
      if (b.estimated) {
        rCtx.setLineDash([4,4]); rCtx.strokeStyle = hexA(col,.5); rCtx.lineWidth = 1;
        rCtx.beginPath(); rCtx.arc(px, py, 22, 0, 7); rCtx.stroke(); rCtx.setLineDash([]);
      }

      // activity glyph above
      rCtx.font = `${Math.round(Math.min(RW,RH)*0.04)}px system-ui`;
      rCtx.textAlign = 'center'; rCtx.textBaseline = 'bottom';
      rCtx.fillText(ICONS[b.activity] || '•', px, py - 12);
    });
  }

  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last)/1000); last = now;
    if (rCtx) {
      rCtx.clearRect(0,0,RW,RH);
      const { cx, cy } = drawFloor();
      drawSweep(cx, cy);
      drawBlips(cx, cy, dt);
      sweep = (sweep + dt*1.6) % (Math.PI*2);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(() => { resize(); requestAnimationFrame(frame); });

  /* ── scenario control ───────────────────── */
  window.setScen = function(btn) {
    if (ws && ws.readyState === 1)
      ws.send(JSON.stringify({ type:'set_scenario', scenario: btn.dataset.s }));
    document.querySelectorAll('.scen-btn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
  };
})();
</script>
</body>
</html>
