esphome:
  name: sensor-node

esp32:
  variant: esp32

logger:

api:
  encryption:
    key: !secret api_key

ota:
 - platform: esphome
   password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Sensor Node Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

binary_sensor:
  - platform: gpio
    pin: GPIO27
    name: "PIR Motion"
    device_class: motion
